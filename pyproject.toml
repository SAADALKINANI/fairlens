[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlens"
version = "0.1.0"
description = "Bias and fairness auditing for binary decision systems: group metrics, disparities, significance tests, HTML reports and mitigation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.scripts]
fairlens = "fairlens.cli:main"

[tool.setuptools]
packages = ["fairlens"]
